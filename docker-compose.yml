services:
  meridian:
    build:
      context: .
      dockerfile: Dockerfile
    image: meridian-media-os:1.0.0
    container_name: meridian-media-os
    ports:
      - "8000:7860"
    environment:
      PORT: "7860"
      HOST: "0.0.0.0"
      DB_PATH: /data/meridian.db
      SEED_ON_BOOT: "1"
      FLIGHT_SOURCE: mock-aodb
      AIDX_SOURCE: mock-aidx
      ACRIS_SOURCE: mock-acris
      AI_PROVIDER: mock
    volumes:
      - meridian-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  meridian-data:
