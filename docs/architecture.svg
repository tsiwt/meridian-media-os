<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Meridian Media OS architecture</title>
  <desc id="desc">Adapters feed canonical entities into the evidence-first decision pipeline and SQLite, exposed by a REST and SSE API to five role views.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e8c8"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38e8c8"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .h1 { font-size: 26px; font-weight: 700; fill: #f4f8ff; letter-spacing: .5px; }
      .h2 { font-size: 12px; font-weight: 700; fill: #8fa6c4; letter-spacing: 1.6px; }
      .lbl { font-size: 13px; font-weight: 600; fill: #e6eefb; }
      .sm { font-size: 10.5px; fill: #9fb3cc; }
      .tiny { font-size: 9.5px; fill: #7f95b2; }
      .box { fill: #101a2c; stroke: #24334d; stroke-width: 1.2; rx: 10; }
      .box2 { fill: #0c1524; stroke: #2a3c59; stroke-width: 1; rx: 8; }
      .edge { stroke: #38e8c8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); opacity: .85; }
      .edge2 { stroke: #8b7bff; stroke-width: 1.4; fill: none; marker-end: url(#arrow); opacity: .85; }
      .divider { stroke: #1c2a40; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#38e8c8" opacity="0.035"/>
  <circle cx="120" cy="640" r="250" fill="#8b7bff" opacity="0.045"/>

  <g class="t">
    <text x="40" y="52" class="h1">Meridian Media OS</text>
    <text x="40" y="74" class="sm">Airport retail media · evidence-first decisions · fictional MQI data</text>
    <rect x="40" y="86" width="250" height="3" fill="url(#accent)" rx="1.5"/>

    <rect x="908" y="30" width="252" height="44" rx="8" fill="#0b1422" stroke="#24334d"/>
    <text x="924" y="49" class="lbl">Offline · stdlib Python 3.11</text>
    <text x="924" y="64" class="tiny">SQLite · REST · SSE · no API key</text>

    <text x="40" y="124" class="h2">SOURCE ADAPTERS</text>
    <text x="330" y="124" class="h2">CANONICAL CORE</text>
    <text x="640" y="124" class="h2">DECISION PIPELINE</text>
    <text x="938" y="124" class="h2">ROLE EXPERIENCES</text>

    <!-- Sources -->
    <rect x="40" y="140" width="250" height="76" class="box"/>
    <text x="56" y="164" class="lbl">AODB CSV · 33 cols</text>
    <text x="56" y="183" class="sm">Flights, gates, A-CDM times, pax</text>
    <text x="56" y="199" class="tiny">data/aodb · FLIGHT_SOURCE</text>

    <rect x="40" y="230" width="250" height="76" class="box"/>
    <text x="56" y="254" class="lbl">IATA AIDX XML</text>
    <text x="56" y="273" class="sm">FlightLegNotifRQ: status, gate, delay</text>
    <text x="56" y="289" class="tiny">samples/ · AIDX_SOURCE</text>

    <rect x="40" y="320" width="250" height="76" class="box"/>
    <text x="56" y="344" class="lbl">ACI ACRIS NGSI-LD</text>
    <text x="56" y="363" class="sm">Zones, checkpoints, queues</text>
    <text x="56" y="379" class="tiny">data/acris · ACRIS_SOURCE</text>

    <rect x="40" y="410" width="250" height="76" class="box"/>
    <text x="56" y="434" class="lbl">Platform telemetry</text>
    <text x="56" y="453" class="sm">Screens, scans, redemptions</text>
    <text x="56" y="469" class="tiny">SQLite · SSE event bus</text>

    <rect x="40" y="500" width="250" height="60" class="box2"/>
    <text x="56" y="522" class="sm">Live vendor adapters (stubs)</text>
    <text x="56" y="540" class="tiny">single config switch · configured:false</text>

    <!-- core -->
    <rect x="330" y="140" width="270" height="420" class="box"/>
    <text x="348" y="166" class="lbl">Canonical model</text>
    <text x="348" y="186" class="sm">Flight · FlightEvent · QueueMeasurement</text>
    <text x="348" y="202" class="sm">Terminal · Zone · Checkpoint</text>
    <text x="348" y="218" class="sm">Screen · Advertiser · Outlet · Campaign</text>
    <text x="348" y="234" class="sm">Creative · PromoCode · Impression · Redemption</text>

    <line x1="348" y1="250" x2="582" y2="250" class="divider"/>
    <text x="348" y="274" class="lbl">Presence engine</text>
    <text x="348" y="293" class="sm">pax × boarding proximity × gate weight</text>
    <text x="348" y="309" class="sm">+ ACRIS queue · 5-minute windows</text>

    <line x1="348" y1="325" x2="582" y2="325" class="divider"/>
    <text x="348" y="349" class="lbl">Crowd profile</text>
    <text x="348" y="368" class="sm">destination · purpose · party · age</text>
    <text x="348" y="384" class="sm">cabin · nationality · language · dwell</text>
    <text x="348" y="400" class="tiny">aggregate shares only · no person data</text>

    <line x1="348" y1="416" x2="582" y2="416" class="divider"/>
    <text x="348" y="440" class="lbl">SQLite</text>
    <text x="348" y="459" class="sm">migrations · deterministic seed</text>
    <text x="348" y="475" class="sm">30-day history · decisions · reports</text>
    <text x="348" y="500" class="tiny">900 flights · 180 screens · 40 outlets</text>

    <rect x="348" y="516" width="234" height="28" rx="6" fill="#0b1422" stroke="#2a3c59"/>
    <text x="360" y="535" class="tiny">REST /api/* · SSE /api/stream</text>

    <!-- pipeline -->
    <rect x="640" y="140" width="260" height="420" class="box" stroke="#38e8c8" filter="url(#glow)"/>
    <text x="658" y="166" class="lbl">1 · Profile</text>
    <text x="658" y="184" class="tiny">measured inputs with source + age</text>
    <text x="658" y="210" class="lbl">2 · Filter</text>
    <text x="658" y="228" class="tiny">schedule · placement · approval · rules</text>
    <text x="658" y="254" class="lbl">3 · Score</text>
    <text x="658" y="272" class="tiny">segment match × deterministic boosts</text>
    <text x="658" y="298" class="lbl">4 · AI propose</text>
    <text x="658" y="316" class="tiny">mock-evidence-v1 · pluggable provider</text>
    <text x="658" y="342" class="lbl">5 · Validate</text>
    <text x="658" y="360" class="tiny">citations fresh · hard rules · recompute</text>
    <text x="658" y="376" class="tiny">confidence ≥ minimum</text>
    <text x="658" y="402" class="lbl">6 · Execute / fall back</text>
    <text x="658" y="420" class="tiny">AI pass → play · else rule default / house</text>
    <text x="658" y="446" class="lbl">7 · Log + learn</text>
    <text x="658" y="464" class="tiny">profile · candidates · scores · evidence</text>
    <text x="658" y="480" class="tiny">scans/redemptions update conversion</text>

    <rect x="658" y="498" width="224" height="46" rx="7" fill="#0a1a22" stroke="#38e8c8" opacity="0.9"/>
    <text x="670" y="517" class="sm" fill="#38e8c8">Hallucinated fact cannot reach a screen</text>
    <text x="670" y="533" class="tiny">auditable via /api/decisions/{id}</text>

    <!-- roles -->
    <rect x="938" y="140" width="222" height="70" class="box"/>
    <text x="954" y="164" class="lbl">Platform Admin</text>
    <text x="954" y="182" class="tiny">map · KPIs · incidents · master data</text>
    <text x="954" y="198" class="tiny">rules · decision log · feed health</text>

    <rect x="938" y="222" width="222" height="70" class="box"/>
    <text x="954" y="246" class="lbl">Retailer</text>
    <text x="954" y="264" class="tiny">live ROI · flow · builder · creatives</text>
    <text x="954" y="280" class="tiny">promo QR · triggers · history</text>

    <rect x="938" y="304" width="222" height="70" class="box"/>
    <text x="954" y="328" class="lbl">Media Manager</text>
    <text x="954" y="346" class="tiny">inventory · yield · approvals</text>
    <text x="954" y="362" class="tiny">packages · conflict · reports</text>

    <rect x="938" y="386" width="222" height="70" class="box"/>
    <text x="954" y="410" class="lbl">Airline Representative</text>
    <text x="954" y="428" class="tiny">my flights · gate messaging</text>
    <text x="954" y="444" class="tiny">goodwill · marketplace · performance</text>

    <rect x="938" y="468" width="222" height="70" class="box"/>
    <text x="954" y="492" class="lbl">Passenger screen</text>
    <text x="954" y="510" class="tiny">16:9 / 9:16 · FIDS strip · QR claim</text>
    <text x="954" y="526" class="tiny">Why this ad? · split-screen demo</text>

    <!-- arrows -->
    <path d="M 290 178 C 310 178, 312 200, 330 200" class="edge"/>
    <path d="M 290 268 C 310 268, 312 236, 330 236" class="edge"/>
    <path d="M 290 358 C 310 358, 312 272, 330 272" class="edge"/>
    <path d="M 290 448 C 310 448, 312 308, 330 308" class="edge"/>
    <path d="M 290 530 C 312 530, 312 344, 330 344" class="edge2" stroke-dasharray="4 4"/>

    <path d="M 600 200 C 620 200, 620 200, 640 200" class="edge"/>
    <path d="M 600 290 C 620 290, 620 290, 640 290" class="edge"/>
    <path d="M 600 430 C 620 430, 620 430, 640 430" class="edge"/>
    <path d="M 640 470 C 620 470, 620 470, 600 470" class="edge2"/>

    <path d="M 900 200 C 918 200, 918 175, 938 175" class="edge"/>
    <path d="M 900 260 C 918 260, 918 257, 938 257" class="edge"/>
    <path d="M 900 320 C 918 320, 918 339, 938 339" class="edge"/>
    <path d="M 900 380 C 918 380, 918 421, 938 421" class="edge"/>
    <path d="M 900 440 C 918 440, 918 503, 938 503" class="edge"/>

    <rect x="40" y="590" width="1120" height="78" rx="10" fill="#0b1422" stroke="#24334d"/>
    <text x="58" y="614" class="lbl">Runtime</text>
    <text x="58" y="634" class="sm">web/ static ES modules (i18n, white-label, 5 role views, split-screen) → app/server.py (REST + SSE + claim/report) → app/api/routes_*.py → domain (decisions, scoring, presence, profile, promos, goodwill, sim)</text>
    <text x="58" y="652" class="tiny">Docker: python:3.11-slim, non-root, /data/meridian.db, port 7860 (compose 8000:7860), HEALTHCHECK /api/health · direct: python -m app.server</text>
    <text x="58" y="667" class="tiny">All airport, airline, retailer and brand names are fictional. Mock data is deterministic; live adapters are stubs until configured.</text>

    <text x="1160" y="692" text-anchor="end" class="tiny">docs/architecture.svg · v1.0.0</text>
  </g>
</svg>
