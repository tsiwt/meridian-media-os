name: docker-verify

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "app/**"
      - "web/**"
      - ".github/workflows/docker-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
      - name: Build and start with compose
        run: docker compose up -d --build
      - name: Wait for health and verify seed
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health -o /tmp/health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/health.json
          cat /tmp/health.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/health.json"))
          assert d["status"] == "ok", d
          assert d["counts"]["flights"] == 900, d
          assert d["counts"]["screens"] == 180, d
          print("health ok", d["seed"])
          PY
      - name: Verify passenger and claim payload
        run: |
          curl -fsS http://127.0.0.1:8000/api/passenger/screens/SCR-122 -o /tmp/passenger.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/passenger.json"))
          assert d["decision"]["winnerId"], d
          assert d["campaign"]["name"], d
          assert d["promo"]["code"], d
          assert d["claimUrl"].startswith("http"), d
          print("passenger ok", d["decision"]["winnerId"], d["promo"]["code"])
          PY
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
