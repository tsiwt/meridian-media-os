name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
      - name: Unit tests
        run: python3 -m unittest tests.test_core -v
      - name: Compile
        run: python3 -m compileall -q app tests tools
      - name: Structure checks
        run: python3 tools/check.py
